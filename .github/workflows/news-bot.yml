name: Telegram News Bot

on:
  schedule:
    # Каждый час с 5:00 до 20:00 UTC = с 8:00 до 23:00 МСК
    - cron: '0 5-20 * * *'
  workflow_dispatch:

jobs:
  build-and-run:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Restore processed posts cache
        uses: actions/cache@v4
        with:
          path: processed_posts.json
          key: processed-posts-v2-${{ github.run_id }}
          restore-keys: |
            processed-posts-v2-

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run news bot script
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY }}
        run: python news_bot.py
